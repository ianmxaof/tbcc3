<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TBCC Save API Key</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
    label { display: block; margin-bottom: 8px; font-size: 13px; color: #aaa; }
    select, input, button { width: 100%; font-size: 14px; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
    button { background: #7c3aed; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    .hint { font-size: 12px; color: #888; word-break: break-all; }
    .err { color: #f87171; font-size: 13px; }
    .ok { color: #4ade80; font-size: 13px; }
  </style>
</head>
<body>
  <h3 style="margin-top:0">Save API key to .env</h3>
  <p class="hint" id="preview"></p>
  <label for="key">Env variable</label>
  <select id="key"></select>
  <label for="custom">Or type custom key</label>
  <input id="custom" type="text" placeholder="TBCC_MY_API_KEY" autocomplete="off" spellcheck="false" />
  <button id="save">Save to .env</button>
  <p id="status"></p>
  <script src="capture-secret-prompt.js"></script>
</body>
</html>
