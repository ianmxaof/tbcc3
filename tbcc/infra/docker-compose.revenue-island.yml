# TBCC revenue island — dedicated Linux VPS (~$5–15/mo). NOT the scrape e2-micro.
#
# Queue audit (celery_app.py task_routes) — slim workers must consume:
#   celery       — sale_announce, loot_promo, scheduler_worker, misc fulfill helpers
#   subscription — grant_access, subscription_worker, milestones, drop_countdown, network_liveness
#   telegram     — import/mirror helpers used by fulfillment paths
#   post_scheduler + post — sale FOMO + scheduled channel posts (worker_post; separate from fulfill)
# Explicitly EXCLUDED: scrape (GCP micro). ops_relay co-located on island worker (listening relay).
#
# Typical bring-up (API only, then bots after home payment/loot stopped):
#   docker compose -f docker-compose.revenue-island.yml --env-file .env.revenue-island up -d postgres redis api worker worker_post beat
#   docker compose -f docker-compose.revenue-island.yml --env-file .env.revenue-island --profile bots up -d
#
# Prefer GHCR pull (set TBCC_WORKER_IMAGE). Build-on-VPS is discouraged on small droplets.

x-island-image: &island-image
  image: ${TBCC_WORKER_IMAGE:-ghcr.io/ianmxaof/tbcc-worker:latest}
  pull_policy: ${TBCC_ISLAND_PULL_POLICY:-if_not_present}
  restart: unless-stopped
  env_file:
    - .env.revenue-island
  environment:
    PYTHONPATH: /app
  working_dir: /app

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tbcc}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - island_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tbcc}"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  api:
    <<: *island-image
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --proxy-headers
      --forwarded-allow-ips='*'
    environment:
      PYTHONPATH: /app
      # Loot media load from Saved Messages (see REVENUE_ISLAND.md). ONE host only.
      TELEGRAM_SESSION_PATH: /sessions/admin
      TBCC_IMPORT_TELEGRAM_SESSION: /sessions/admin_import
      TBCC_IMPORT_AUTO_COPY_ADMIN_SESSION: "1"
      # Loot roll delivery reads on its own SQLite file — Celery import workers hold a
      # long-lived handle on admin_import.session and starve album downloads.
      TBCC_ALBUM_COMPOSER_TELEGRAM_SESSION: /sessions/admin_album
      TBCC_ALBUM_COMPOSER_AUTO_COPY_ADMIN_SESSION: "1"
      TBCC_RELAY_USE_BOT_API: ${TBCC_RELAY_USE_BOT_API:-0}
      TBCC_BUNDLE_DIR: /uploads/bundles
      TBCC_PROMO_DIR: /uploads/promo
      TBCC_MEDIA_FILES_DIR: /uploads/media-files
      # Island stock is mostly Telegram Saved Messages refs (not /uploads bytes).
      TBCC_LOOT_LOCAL_BYTES_ONLY: "0"
      TBCC_POOL_IMPORT_LOCAL: "1"
    volumes:
      - /opt/tbcc/sessions:/sessions:rw
      - /opt/tbcc/uploads:/uploads:rw
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *island-image
    command: >
      celery -A app.workers.celery_app worker
      -l info
      -P solo
      -Q celery,subscription,telegram,ops_growth,ops_relay
      -n island@%h
      --without-gossip
      --without-mingle
    environment:
      PYTHONPATH: /app
      TELEGRAM_SESSION_PATH: /sessions/admin
      # Storage Hub → pool → SENT CACHE (telegram queue). Absolute path survives cwd=/app.
      TBCC_IMPORT_TELEGRAM_SESSION: /sessions/admin_import
      TBCC_IMPORT_AUTO_COPY_ADMIN_SESSION: "1"
      TBCC_RELAY_USE_BOT_API: ${TBCC_RELAY_USE_BOT_API:-0}
      # Beat seed (ops_growth until next GHCR bake routes seed → telegram).
      TBCC_STORAGE_POOL_SEED_ENABLED: "1"
      TBCC_STORAGE_POOL_SEED_BATCH: "12"
      TBCC_STORAGE_POOL_SEED_HOURS: "2"
      # Old AOF Main is restricted — mirroring burns the solo telegram worker.
      TBCC_DEPOSIT_TOPIC_MIRROR: "0"
      TBCC_TOPIC_MIRROR_ENABLED: "0"
      # Buffer X queue stocking (beat + worker_ready startup refill).
      TBCC_BUFFER_ARMORY_MIN_DEPTH: "2"
      TBCC_BUFFER_ARMORY_REFILL_HOURS: "24"
      TBCC_BUFFER_ARMORY_STARTUP_REFILL: "0"
      TBCC_BUFFER_ARMORY_STARTUP_DELAY_S: "90"
      TBCC_BUFFER_NATIVE_MIN_DEPTH: "2"
      TBCC_BUFFER_NATIVE_MAX_SCHEDULED: "8"
      # Metrics sync hammers Buffer API — run less often on island (refill owns quota).
      TBCC_BUFFER_METRICS_SYNC_ENABLED: "1"
      TBCC_BUFFER_METRICS_SYNC_HOURS: "6"
      TBCC_MEDIA_FILES_DIR: /uploads/media-files
      TBCC_POOL_IMPORT_LOCAL: "1"
      TBCC_LANE_SURVIVOR_REFILL_ENABLED: "1"
      TBCC_TRAFFIC_PULSE_ENABLED: "1"
      TBCC_TRAFFIC_PULSE_INSTANT: beacon,start,post_fail
      TBCC_AFFILIATE_BEACON_WRAP: "1"
      TBCC_CLICK_BEACON_INSTANT: "1"
    volumes:
      - /opt/tbcc/sessions:/sessions:rw
      - /opt/tbcc/uploads:/uploads:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Sale FOMO + scheduled text/media posts. Separate solo worker so fulfill
  # (subscription/telegram) never waits behind Telethon poster lock.
  worker_post:
    <<: *island-image
    command: >
      celery -A app.workers.celery_app worker
      -l info
      -P solo
      -Q post_scheduler,post
      -n island-post@%h
      --without-gossip
      --without-mingle
    environment:
      PYTHONPATH: /app
      TELEGRAM_SESSION_PATH: /sessions/admin
      # Separate SQLite file on the shared volume; auto-copy from admin on first use.
      TBCC_POSTER_TELEGRAM_SESSION: /sessions/admin_poster
      TBCC_POSTER_AUTO_COPY_ADMIN_SESSION: "1"
      TBCC_MEDIA_FILES_DIR: /uploads/media-files
    volumes:
      - /opt/tbcc/sessions:/sessions:rw
      - /opt/tbcc/uploads:/uploads:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    <<: *island-image
    command: >
      celery -A app.workers.celery_app beat
      -l info
    environment:
      TBCC_LANE_SURVIVOR_REFILL_ENABLED: "1"
      TBCC_TRAFFIC_PULSE_ENABLED: "1"
    depends_on:
      - redis
      - worker

  payment_bot:
    <<: *island-image
    profiles: ["bots"]
    command: python -m bots.payment_bot
    environment:
      PYTHONPATH: /app
      TBCC_BUNDLE_DIR: /uploads/bundles
      TBCC_PROMO_DIR: /uploads/promo
      TBCC_MEDIA_FILES_DIR: /uploads/media-files
      TBCC_LOOT_LOCAL_BYTES_ONLY: "1"
      TBCC_POOL_IMPORT_LOCAL: "1"
    volumes:
      - /opt/tbcc/uploads:/uploads:rw
    depends_on:
      - api
      - redis
      - postgres

  loot_bot:
    <<: *island-image
    profiles: ["bots"]
    command: python -m bots.loot_bot
    depends_on:
      - api
      - redis
      - postgres

  # @aof_spicybot_bot — LLM chat + undress webhooks (API serves /webhooks/companion/*).
  companion_bot:
    <<: *island-image
    profiles: ["bots"]
    command: python -m bots.companion_bot
    depends_on:
      - api
      - redis
      - postgres

  # @aof_secretary_bot — admin inbox + Traffic Pulse DMs (keep home secretary Off to avoid 409).
  secretary_bot:
    <<: *island-image
    profiles: ["bots"]
    command: python -m bots.secretary_bot
    depends_on:
      - api
      - redis
      - postgres

volumes:
  island_pgdata:
