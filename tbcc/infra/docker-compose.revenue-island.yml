# TBCC revenue island — dedicated Linux VPS (~$5–15/mo). NOT the scrape e2-micro.
#
# Queue audit (celery_app.py task_routes) — slim workers must consume:
#   celery + subscription + ops_* — fulfill / growth / relay (worker)
#   telegram                     — Hub→R2 + Telethon import (worker_telegram; solo lock)
#   post_scheduler + post        — sale FOMO + scheduled posts (worker_post)
# Explicitly EXCLUDED: scrape (GCP micro). Do not raise solo concurrency on this VPS.
#
# Typical bring-up (API only, then bots after home payment/loot stopped):
#   docker compose -f docker-compose.revenue-island.yml --env-file .env.revenue-island \
#     up -d postgres redis api worker worker_telegram worker_post beat
#   docker compose -f docker-compose.revenue-island.yml --env-file .env.revenue-island --profile bots up -d
#
# Prefer GHCR pull (set TBCC_WORKER_IMAGE). Build-on-VPS is discouraged on small droplets.
#
# Always-on UI (dashboard + AOF Forum) — optional profile, see docs/ISLAND_UI_SURFACES.md:
#   docker compose -f docker-compose.revenue-island.yml --env-file .env.revenue-island --profile ui up -d dashboard forum

x-island-image: &island-image
  image: ${TBCC_WORKER_IMAGE:-ghcr.io/ianmxaof/tbcc-worker:latest}
  pull_policy: ${TBCC_ISLAND_PULL_POLICY:-if_not_present}
  restart: unless-stopped
  env_file:
    - .env.revenue-island
  environment:
    PYTHONPATH: /app
  working_dir: /app

services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tbcc}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - island_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tbcc}"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    restart: always
    # requirepass + loopback-only bind — 2026-08-18: found reconfigured as an
    # unauthenticated replica of an external host (185.241.208.112:443), the
    # classic exposed-Redis takeover pattern. Never publish on 0.0.0.0 again.
    command: ["redis-server", "--requirepass", "${TBCC_REDIS_PASSWORD:?Set TBCC_REDIS_PASSWORD in infra/.env.revenue-island}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${TBCC_REDIS_PASSWORD:?Set TBCC_REDIS_PASSWORD in infra/.env.revenue-island}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  api:
    <<: *island-image
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --proxy-headers
      --forwarded-allow-ips='*'
    environment:
      PYTHONPATH: /app
      TBCC_REVENUE_ISLAND_ACTIVE: "1"
      # Loot media load from Saved Messages (see REVENUE_ISLAND.md). ONE host only.
      TELEGRAM_SESSION_PATH: /sessions/admin
      TBCC_IMPORT_TELEGRAM_SESSION: /sessions/admin_import
      TBCC_IMPORT_AUTO_COPY_ADMIN_SESSION: "1"
      # Loot roll delivery reads on its own SQLite file — Celery import workers hold a
      # long-lived handle on admin_import.session and starve album downloads.
      TBCC_ALBUM_COMPOSER_TELEGRAM_SESSION: /sessions/admin_album
      TBCC_ALBUM_COMPOSER_AUTO_COPY_ADMIN_SESSION: "1"
      TBCC_RELAY_USE_BOT_API: ${TBCC_RELAY_USE_BOT_API:-0}
      TBCC_BUNDLE_DIR: /uploads/bundles
      TBCC_PROMO_DIR: /uploads/promo
      TBCC_MEDIA_FILES_DIR: /uploads/media-files
      # Island stock is mostly Telegram Saved Messages refs (not /uploads bytes).
      TBCC_LOOT_LOCAL_BYTES_ONLY: "0"
      TBCC_POOL_IMPORT_LOCAL: "1"
    volumes:
      - /opt/tbcc/sessions:/sessions:rw
      - /opt/tbcc/uploads:/uploads:rw
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Fulfill + growth + relay — no telegram queue (Telethon lock lives on worker_telegram).
  worker:
    <<: *island-image
    command: >
      celery -A app.workers.celery_app worker
      -l info
      -P solo
      -Q celery,subscription,ops_growth,ops_relay
      -n island@%h
      --without-gossip
      --without-mingle
    environment:
      PYTHONPATH: /app
      TBCC_REVENUE_ISLAND_ACTIVE: "1"
      TELEGRAM_SESSION_PATH: /sessions/admin
      # Loot durability survivor probe (scripts/loot_durability_check.py) needs its own
      # dedicated session — without this it defaults to a bare "admin_album" stem inside
      # the container's ephemeral filesystem instead of the real logged-in session here.
      TBCC_ALBUM_COMPOSER_TELEGRAM_SESSION: /sessions/admin_album
      TBCC_ALBUM_COMPOSER_AUTO_COPY_ADMIN_SESSION: "1"
      TBCC_RELAY_USE_BOT_API: ${TBCC_RELAY_USE_BOT_API:-0}
      # Beat seed (ops_growth until next GHCR bake routes seed → telegram).
      TBCC_STORAGE_POOL_SEED_ENABLED: "1"
      TBCC_STORAGE_POOL_SEED_BATCH: "12"
      TBCC_STORAGE_POOL_SEED_HOURS: "2"
      TBCC_DEPOSIT_TOPIC_MIRROR: "0"
      TBCC_TOPIC_MIRROR_ENABLED: "0"
      # Buffer X queue stocking (beat + worker_ready startup refill).
      TBCC_BUFFER_ARMORY_MIN_DEPTH: "2"
      TBCC_BUFFER_ARMORY_REFILL_HOURS: "24"
      TBCC_BUFFER_ARMORY_STARTUP_REFILL: "0"
      TBCC_BUFFER_ARMORY_STARTUP_DELAY_S: "90"
      TBCC_BUFFER_NATIVE_MIN_DEPTH: "2"
      TBCC_BUFFER_NATIVE_MAX_SCHEDULED: "8"
      # Metrics sync hammers Buffer API — run less often on island (refill owns quota).
      TBCC_BUFFER_METRICS_SYNC_ENABLED: "1"
      TBCC_BUFFER_METRICS_SYNC_HOURS: "6"
      TBCC_MEDIA_FILES_DIR: /uploads/media-files
      TBCC_POOL_IMPORT_LOCAL: "1"
      TBCC_LANE_SURVIVOR_REFILL_ENABLED: "1"
      TBCC_TRAFFIC_PULSE_ENABLED: "1"
      TBCC_TRAFFIC_PULSE_INSTANT: beacon,start,post_fail
      TBCC_AFFILIATE_BEACON_WRAP: "1"
      TBCC_CLICK_BEACON_INSTANT: "1"
    volumes:
      - /opt/tbcc/sessions:/sessions:rw
      - /opt/tbcc/uploads:/uploads:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Telethon / Hub→R2 / import — dedicated solo process so R2 drain does not block grant_access.
  worker_telegram:
    <<: *island-image
    command: >
      celery -A app.workers.celery_app worker
      -l info
      -P solo
      -Q telegram
      -n island-tg@%h
      --without-gossip
      --without-mingle
    environment:
      PYTHONPATH: /app
      TBCC_REVENUE_ISLAND_ACTIVE: "1"
      TELEGRAM_SESSION_PATH: /sessions/admin
      TBCC_IMPORT_TELEGRAM_SESSION: /sessions/admin_import
      TBCC_IMPORT_AUTO_COPY_ADMIN_SESSION: "1"
      TBCC_DEPOSIT_TOPIC_MIRROR: "0"
      TBCC_TOPIC_MIRROR_ENABLED: "0"
      TBCC_MEDIA_FILES_DIR: /uploads/media-files
      TBCC_POOL_IMPORT_LOCAL: "1"
      TBCC_STORAGE_HUB_R2_EXPORT_ENABLED: "1"
    volumes:
      - /opt/tbcc/sessions:/sessions:rw
      - /opt/tbcc/uploads:/uploads:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Sale FOMO + scheduled text/media posts. Separate solo worker so fulfill
  # never waits behind Telethon poster lock.
  worker_post:
    <<: *island-image
    command: >
      celery -A app.workers.celery_app worker
      -l info
      -P solo
      -Q post_scheduler,post
      -n island-post@%h
      --without-gossip
      --without-mingle
    environment:
      PYTHONPATH: /app
      TELEGRAM_SESSION_PATH: /sessions/admin
      # Separate SQLite file on the shared volume; auto-copy from admin on first use.
      TBCC_POSTER_TELEGRAM_SESSION: /sessions/admin_poster
      TBCC_POSTER_AUTO_COPY_ADMIN_SESSION: "1"
      TBCC_MEDIA_FILES_DIR: /uploads/media-files
    volumes:
      - /opt/tbcc/sessions:/sessions:rw
      - /opt/tbcc/uploads:/uploads:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    <<: *island-image
    command: >
      celery -A app.workers.celery_app beat
      -l info
    environment:
      TBCC_REVENUE_ISLAND_ACTIVE: "1"
      # No scrape consumer on island — leave scheduler + micro-pull off (Hub→R2 is volume path).
      TBCC_SCRAPE_SCHEDULER_ENABLED: "0"
      TBCC_SCRAPE_MICRO_PULL_ENABLED: "0"
      TBCC_MARKET_INTEL_PROBE_ENABLED: "0"
      TBCC_MARKET_INTEL_CYCLE_ENABLED: "0"
      TBCC_STORAGE_HUB_R2_EXPORT_ENABLED: "1"
      TBCC_LANE_SURVIVOR_REFILL_ENABLED: "1"
      TBCC_TRAFFIC_PULSE_ENABLED: "1"
    depends_on:
      - redis
      - worker
      - worker_telegram

  payment_bot:
    <<: *island-image
    profiles: ["bots"]
    command: python -m bots.payment_bot
    environment:
      PYTHONPATH: /app
      TBCC_BUNDLE_DIR: /uploads/bundles
      TBCC_PROMO_DIR: /uploads/promo
      TBCC_MEDIA_FILES_DIR: /uploads/media-files
      TBCC_LOOT_LOCAL_BYTES_ONLY: "1"
      TBCC_POOL_IMPORT_LOCAL: "1"
    volumes:
      - /opt/tbcc/uploads:/uploads:rw
    depends_on:
      - api
      - redis
      - postgres

  loot_bot:
    <<: *island-image
    profiles: ["bots"]
    command: python -m bots.loot_bot
    depends_on:
      - api
      - redis
      - postgres

  # @aof_macrosearch_bot — OF overlay twin (username probe + archive /find). Keep home macro_search Off.
  macro_search_bot:
    <<: *island-image
    profiles: ["bots"]
    command: python -m bots.macro_search_bot
    environment:
      PYTHONPATH: /app
      TBCC_API_URL: http://api:8000
    depends_on:
      - api
      - redis
      - postgres

  # @aof_spicybot_bot — LLM chat + undress webhooks (API serves /webhooks/companion/*).
  companion_bot:
    <<: *island-image
    profiles: ["bots"]
    command: python -m bots.companion_bot
    depends_on:
      - api
      - redis
      - postgres

  # @aof_secretary_bot — admin inbox + Traffic Pulse DMs (keep home secretary Off to avoid 409).
  secretary_bot:
    <<: *island-image
    profiles: ["bots"]
    command: python -m bots.secretary_bot
    depends_on:
      - api
      - redis
      - postgres

  # @aof remixer — Storage Hub panels, /deposit, Q&A master (keep home album_composer Off).
  # /rebundle scans via Telethon import session — must share /sessions with api/worker.
  album_composer_bot:
    <<: *island-image
    profiles: ["bots"]
    command: python -m bots.album_composer_bot
    environment:
      PYTHONPATH: /app
      TBCC_PAYMENT_STORAGE_HUB: "0"
      TBCC_ALBUM_COMPOSER_STORAGE_HUB: "1"
      TBCC_ALBUM_COMPOSER_STORAGE_DEPOSIT: "1"
      TBCC_GATEKEEPER_REVIEW_BOT: album_composer
      TELEGRAM_SESSION_PATH: /sessions/admin
      TBCC_IMPORT_TELEGRAM_SESSION: /sessions/admin_import
      TBCC_IMPORT_AUTO_COPY_ADMIN_SESSION: "1"
      TBCC_ALBUM_COMPOSER_TELEGRAM_SESSION: /sessions/admin_album
      TBCC_ALBUM_COMPOSER_AUTO_COPY_ADMIN_SESSION: "1"
    volumes:
      - /opt/tbcc/sessions:/sessions:rw
      - /opt/tbcc/uploads:/uploads:rw
    depends_on:
      - api
      - redis
      - postgres

  # --- Always-on UI surfaces (profile: ui) — no home npm / Vite required ---
  # Bring-up:
  #   docker compose -f docker-compose.revenue-island.yml --env-file .env.revenue-island --profile ui up -d dashboard forum
  # Tunnel hostnames (Cloudflare Access recommended on dash):
  #   dash.powercore.app  → http://127.0.0.1:5173  (or dashboard:80 on compose network via cloudflared)
  #   forum.powercore.app → http://127.0.0.1:3001
  dashboard:
    profiles: ["ui"]
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    image: ${TBCC_DASHBOARD_IMAGE:-ghcr.io/ianmxaof/tbcc-dashboard:latest}
    pull_policy: ${TBCC_ISLAND_PULL_POLICY:-if_not_present}
    restart: unless-stopped
    env_file:
      - .env.revenue-island
    environment:
      TBCC_API_UPSTREAM: http://api:8000
      TBCC_API_UPSTREAM_HOST: api
      TBCC_API_UPSTREAM_PORT: "8000"
      TBCC_INTERNAL_API_KEY: ${TBCC_INTERNAL_API_KEY:-}
    ports:
      # All interfaces + iptables allowlist (localhost + Tailscale 100.64/10). Tunnel still hits 127.0.0.1.
      - "5173:80"
    depends_on:
      - api

  forum:
    profiles: ["ui"]
    build:
      context: ${AOF_FORUM_BUILD_CONTEXT:-../../aof-forum}
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${TBCC_FORUM_PUBLIC_URL:-https://forum.powercore.app}
    image: ${AOF_FORUM_IMAGE:-ghcr.io/ianmxaof/aof-forum:latest}
    pull_policy: ${TBCC_ISLAND_PULL_POLICY:-if_not_present}
    restart: unless-stopped
    env_file:
      - .env.revenue-island
    environment:
      PORT: "3001"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: ${TBCC_FORUM_PUBLIC_URL:-https://forum.powercore.app}
      TBCC_DASHBOARD_PUBLIC_URL: ${TBCC_DASHBOARD_PUBLIC_URL:-https://dash.powercore.app}
      TBCC_ADMIN_BRIDGE_SECRET: ${TBCC_ADMIN_BRIDGE_SECRET:-}
      TBCC_INTERNAL_API_KEY: ${TBCC_INTERNAL_API_KEY:-}
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  island_pgdata:
