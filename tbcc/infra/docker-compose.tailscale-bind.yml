# Extra publish of Postgres + Redis on the home Tailscale IP for the remote scrape VM.
# Base docker-compose.infra.yml already binds 0.0.0.0:5432/6379 for the home stack.
# Do NOT also bind 127.0.0.1 here — that conflicts with the 0.0.0.0 publish.
#
# Replace 100.120.157.60 with: tailscale ip -4  (on home PC)
#
# Usage (home):
#   cd tbcc/infra
#   docker compose -f docker-compose.infra.yml -f docker-compose.tailscale-bind.yml up -d

services:
  postgres:
    ports:
      - "100.120.157.60:5432:5432"

  redis:
    ports:
      - "100.120.157.60:6379:6379"
