name: TBCC remote worker image (GHCR)

# Build and push the Celery worker image so remote VMs can `docker compose pull`
# instead of burning CPU on `docker compose build`.

on:
  push:
    branches: [main, lean-stack-hardening]
    paths:
      - "tbcc/backend/**"
      - "tbcc/infra/docker-compose.remote-worker*.yml"
      - ".github/workflows/tbcc-remote-worker-ghcr.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/ianmxaof/tbcc-worker

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: tbcc/backend
          file: tbcc/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
